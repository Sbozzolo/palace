name: Containers

# Build OCI/SIF containers.
#
# Non-tag events (push to main, PRs, manual dispatch) build the runner's native
# microarchitecture:
# - sapphirerapids   (x64,       c7i)
# - neoverse_v1      (arm64,     c7g)
#
# Release tags (vX.Y.Z) build a full microarchitecture matrix instead
# (build-containers-release):
# - x86_64_v3, x86_64_v4, sapphirerapids   on the x64 (c7i) host
# - aarch64, neoverse_v1, neoverse_v2      on the arm64-8g (Graviton4) host
# Each target is at or below its host's native ISA, so build-time binaries run
# on the host (no cross-compile-up). graniterapids is intentionally omitted (it
# would need a newer x64 host, e.g. c8i).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # 'labeled' so adding the `push-containers` label triggers a prototype
    # deploy; the rest are the usual PR-build triggers.
    types: [opened, reopened, synchronize, labeled]
  # Manual build-only re-run (e.g. after a transient runner failure). Never
  # publishes — prototype deploys go through the `push-containers` PR label.
  workflow_dispatch:

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_USER: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Filter to allow skipping the test if no relevant changes occurred.
  filter:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            test:
              - 'palace/**'
              - 'cmake/**'
              - 'extern/**'
              - 'spack_repo/**'
              - '.github/actions/**'
              - '.github/workflows/containers.yml'

  # Non-tag events (push to main, PRs, manual dispatch): build the runner's
  # native microarchitecture. Release tags are handled by build-containers-
  # release below, so this job is gated off for them to avoid double builds.
  build-containers:
    needs: filter
    # TEMP(container-cuda test): also skip on workflow_dispatch so a dispatch run
    # exercises ONLY build-containers-cuda. Revert to
    # `if: ${{ !startsWith(github.ref, 'refs/tags/v') }}` before merge.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: [self-hosted, '${{ matrix.arch }}']
    steps:
      - uses: actions/checkout@v6
        if: needs.filter.outputs.test == 'true'
      - uses: ./.github/actions/build-container
        if: needs.filter.outputs.test == 'true'

  # Release tags (vX.Y.Z): build the full microarchitecture matrix. No paths-
  # filter — a tag is usually cut on a commit already on main, so the diff is
  # empty and the filter would skip, silently dropping the versioned publish.
  # Each target is at or below its host's native ISA (see header comment).
  build-containers-release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: x64,      target: x86_64_v3}
          - {runner: x64,      target: x86_64_v4}
          - {runner: x64,      target: sapphirerapids}
          - {runner: arm64-8g, target: aarch64}
          - {runner: arm64-8g, target: neoverse_v1}
          - {runner: arm64-8g, target: neoverse_v2}
    runs-on: [self-hosted, '${{ matrix.runner }}']
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch tags so the release channel can derive the version from the ref.
          fetch-depth: 0
      - uses: ./.github/actions/build-container
        with:
          target: ${{ matrix.target }}

  # Release tags (vX.Y.Z): build a CUDA container. nvcc cross-compiles device
  # code for the requested compute capability, so the build host needs no GPU of
  # that capability — it runs on the gpu runner (A10G / sm_86) purely for its
  # CUDA toolkit. cuda_80 (A100/sm_80) is built here; the image is labelled
  # cuda_80 to distinguish it from CPU-only images.
  # TEMP(container-cuda test): `|| workflow_dispatch` lets this be dispatched off
  # a branch for validation. Build-only (metadata sets PUSH=false). Revert to
  # `if: startsWith(github.ref, 'refs/tags/v')` before merge.
  build-containers-cuda:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetch tags so the release channel can derive the version from the ref.
          fetch-depth: 0
      - uses: ./.github/actions/build-container
        with:
          cuda_arch: '80'
